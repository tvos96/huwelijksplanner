[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/* wijst (net als op Cloudflare Pages) naar dezelfde functies, zodat de
# front-end overal met hetzelfde pad kan werken.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: alle overige routes naar index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
